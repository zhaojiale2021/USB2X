name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    name: CMake (${{ matrix.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: debug
            output: Debug
          - preset: release
            output: Release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Build
        run: ./build.sh ${{ matrix.preset }}

      - name: Report size
        run: arm-none-eabi-size build/bin/${{ matrix.output }}/USB2X.elf

  xmake:
    name: xmake (release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build
        run: |
          xmake f -m release --variant=CANABLE -y
          xmake -y

      - name: Report size
        run: arm-none-eabi-size build/bin/Release/USB2X.elf

  f7-demo:
    name: F7 USB-Ethernet demo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Fetch TinyUSB STM32F7 dependencies
        run: python3 lib/tinyusb/tools/get_deps.py hw/mcu/st/cmsis_device_f7 hw/mcu/st/stm32f7xx_hal_driver

      - name: Build
        run: |
          cmake -S examples/usb_eth_f7 -B examples/usb_eth_f7/build -G Ninja \
            -DBOARD=stm32f746disco -DCMAKE_BUILD_TYPE=Release
          cmake --build examples/usb_eth_f7/build

      - name: Report size
        run: arm-none-eabi-size examples/usb_eth_f7/build/usb_eth_f7.elf

  # 汇总门禁:分支 ruleset 只要求 "CI required" 这一个稳定的检查名,
  # 以后增删矩阵维度或给作业改名,都不用回头改 ruleset。
  gate:
    name: CI required
    runs-on: ubuntu-latest
    needs: [cmake, xmake, f7-demo]
    if: always()
    steps:
      - name: 所有上游作业都成功才算通过
        run: |
          echo "cmake=${{ needs.cmake.result }} xmake=${{ needs.xmake.result }} f7-demo=${{ needs.f7-demo.result }}"
          if [ "${{ needs.cmake.result }}" != "success" ] || [ "${{ needs.xmake.result }}" != "success" ] || [ "${{ needs.f7-demo.result }}" != "success" ]; then
            echo "::error::上游作业失败或被取消,门禁不通过"
            exit 1
          fi
